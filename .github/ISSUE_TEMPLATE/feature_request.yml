name: Feature request
description: Suggest an idea for Runcraft
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and what is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
