<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Runcraft</title>
    <style>
      :root {
        --bg: #08080b;
        --panel: #111116;
        --line: #23232b;
        --fg: #ededf2;
        --muted: #a1a1b0;
        --faint: #6c6c7c;
        --accent: #8b5cf6;
        --ok: #22c55e;
        --warn: #f5a524;
        --bad: #f04444;
        --info: #60a5fa;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f7;
          --panel: #ffffff;
          --line: #e4e4ea;
          --fg: #17171c;
          --muted: #52525e;
          --faint: #85858f;
          --ok: #16a34a;
          --warn: #b45309;
          --bad: #dc2626;
          --info: #2563eb;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Inter',
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: white;
        font-weight: 700;
        font-size: 13px;
      }
      select {
        flex: 1;
        min-width: 0;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        font-size: 17px;
      }
      .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
      }
      .live.on {
        background: var(--ok);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent);
      }
      main {
        padding: 12px 16px calc(env(safe-area-inset-bottom) + 24px);
        display: grid;
        gap: 10px;
      }
      .summary {
        color: var(--muted);
        font-size: 13px;
        padding: 2px 2px 4px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .name {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        background: color-mix(in srgb, var(--c) 14%, transparent);
        color: var(--c);
      }
      .pill::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .meta {
        margin-top: 6px;
        color: var(--faint);
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        height: 38px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
      }
      button:active {
        transform: scale(0.98);
      }
      button.start {
        background: var(--ok);
        border-color: var(--ok);
        color: white;
      }
      button.stop {
        color: var(--bad);
      }
      button:disabled {
        opacity: 0.4;
      }
      .sheet {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        background: var(--bg);
      }
      .sheet.open {
        display: flex;
      }
      .sheet header button {
        flex: 0 0 auto;
        width: auto;
        padding: 0 12px;
        height: 32px;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 10px 12px calc(env(safe-area-inset-bottom) + 16px);
        font:
          11.5px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .error {
        color: var(--bad);
      }
      #log .warn {
        color: var(--warn);
      }
      #log .sys {
        color: var(--faint);
      }
      .empty {
        text-align: center;
        color: var(--faint);
        padding: 48px 16px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">R</div>
      <select id="project" aria-label="Project"></select>
      <span id="live" class="live" title="Live"></span>
    </header>
    <main id="list"><p class="empty">Connecting…</p></main>

    <div id="sheet" class="sheet">
      <header>
        <button id="back">← Back</button>
        <span id="sheetTitle" class="name"></span>
        <span id="sheetPill"></span>
      </header>
      <pre id="log"></pre>
    </div>

    <script>
      const token = new URLSearchParams(location.search).get('t') || ''
      const COLORS = { running: 'var(--ok)', starting: 'var(--info)', unhealthy: 'var(--warn)', stopping: 'var(--warn)', crashed: 'var(--bad)' }
      const LABELS = {
        running: 'Online',
        starting: 'Starting',
        unhealthy: 'Unhealthy',
        stopping: 'Stopping',
        crashed: 'Crashed',
        stopped: 'Stopped',
        idle: 'Idle',
      }
      const LIVE = ['starting', 'running', 'unhealthy', 'stopping']
      const ANSI = /\x1b\[[0-9;?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g
      const $ = (id) => document.getElementById(id)
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

      let pid = localStorage.getItem('runcraft.phone.project')
      let state = { config: { services: [] }, services: {}, logs: {} }
      let open = null

      const api = (method, path) =>
        fetch(path, { method, headers: { 'x-runcraft-token': token } }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))

      function uptime(t) {
        if (!t) return ''
        const s = Math.floor((Date.now() - t) / 1000)
        return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`
      }

      function pill(status) {
        return `<span class="pill" style="--c:${COLORS[status] || 'var(--faint)'}">${LABELS[status] || status}</span>`
      }

      function render() {
        const list = state.config.services
        if (!list.length) return ($('list').innerHTML = '<p class="empty">No services in this project.</p>')
        const live = list.filter((s) => LIVE.includes(state.services[s.id]?.status)).length
        $('list').innerHTML =
          `<div class="summary">${live} of ${list.length} running</div>` +
          list
            .map((cfg) => {
              const st = state.services[cfg.id] || { status: 'idle' }
              const on = LIVE.includes(st.status)
              const meta = [
                st.port && `:${st.port}`,
                on && uptime(st.startedAt),
                st.usage && `${Math.round(st.usage.cpu)}% · ${Math.round(st.usage.mem / 1048576)} MB`,
              ]
              return `<div class="card" data-id="${esc(cfg.id)}">
                <div class="row"><span class="name">${esc(cfg.name)}</span>${pill(st.status)}</div>
                <div class="meta">${meta.filter(Boolean).map(esc).join('<span>·</span>') || esc(cfg.command)}</div>
                <div class="actions">
                  ${on ? `<button class="stop" data-act="stop">Stop</button><button data-act="restart">Restart</button>` : `<button class="start" data-act="start">Start</button>`}
                  <button data-act="logs">Logs</button>
                </div>
              </div>`
            })
            .join('')
      }

      function renderLog() {
        if (!open) return
        const st = state.services[open] || { status: 'idle' }
        $('sheetPill').innerHTML = pill(st.status)
        const el = $('log')
        const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40
        el.innerHTML = (state.logs[open] || [])
          .slice(-400)
          .map((l) => `<div class="${l.s === 'sys' ? 'sys' : l.lvl}">${esc(l.text.replace(ANSI, ''))}</div>`)
          .join('')
        if (atBottom) el.scrollTop = el.scrollHeight
      }

      async function load() {
        const projects = await api('GET', '/api/projects')
        if (!projects.some((p) => p.id === pid)) pid = (projects.find((p) => p.running) || projects[0] || {}).id
        $('project').innerHTML = projects.map((p) => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')
        if (!pid) return ($('list').innerHTML = '<p class="empty">No projects yet.</p>')
        const [snap, logs] = await Promise.all([api('GET', `/api/p/${pid}`), api('GET', `/api/p/${pid}/logs`)])
        state = { config: snap.config, services: Object.fromEntries(snap.services.map((s) => [s.id, s])), logs }
        render()
        renderLog()
      }

      function connect() {
        const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?t=${encodeURIComponent(token)}`)
        ws.onopen = () => ($('live').className = 'live on')
        ws.onclose = () => {
          $('live').className = 'live'
          setTimeout(connect, 2000)
        }
        ws.onmessage = (e) => {
          let dirty = false
          for (const m of JSON.parse(e.data)) {
            if (m.project !== pid) continue
            if (m.type === 'status') state.services[m.service.id] = { ...state.services[m.service.id], ...m.service }
            else if (m.type === 'stats') for (const [id, u] of Object.entries(m.data)) state.services[id] = { ...state.services[id], usage: u }
            else if (m.type === 'config') state.config = m.config
            else if (m.type === 'log') {
              const lines = (state.logs[m.id] ||= [])
              lines.push(m.line)
              if (lines.length > 1000) lines.splice(0, 400)
              if (m.id === open) dirty = true
              continue
            }
            dirty = true
          }
          if (dirty) {
            render()
            renderLog()
          }
        }
      }

      $('list').addEventListener('click', (e) => {
        const btn = e.target.closest('button')
        const card = e.target.closest('.card')
        if (!btn || !card) return
        const id = card.dataset.id
        if (btn.dataset.act === 'logs') {
          open = id
          $('sheetTitle').textContent = state.config.services.find((s) => s.id === id)?.name || id
          $('sheet').classList.add('open')
          $('log').scrollTop = 1e9
          return renderLog()
        }
        btn.disabled = true
        api('POST', `/api/p/${pid}/s/${encodeURIComponent(id)}/${btn.dataset.act}`).catch(() => (btn.disabled = false))
      })
      $('back').onclick = () => {
        open = null
        $('sheet').classList.remove('open')
      }
      $('project').onchange = (e) => {
        pid = e.target.value
        localStorage.setItem('runcraft.phone.project', pid)
        load()
      }
      setInterval(() => !open && render(), 15000)

      load().then(connect, () => ($('list').innerHTML = '<p class="empty">This link has expired. Scan the QR code in Runcraft again.</p>'))
    </script>
  </body>
</html>
